name: One-off Figure 1 label fix

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-figure1.yml'

permissions:
  contents: write

jobs:
  fix-figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Widen Figure 1 target-label boxes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ros_worm_stage1/validation/publication_figures/main/Figure1_framework.svg')
          s = p.read_text()
          old1 = '''M 121.024221 32.165322 \nL 154.823714 32.165322 \nL 154.823714 21.957544 \nL 121.024221 21.957544'''
          new1 = '''M 110.923968 32.165322 \nL 164.923968 32.165322 \nL 164.923968 21.957544 \nL 110.923968 21.957544'''
          old2 = '''M 389.276598 32.165322 \nL 423.076091 32.165322 \nL 423.076091 21.957544 \nL 389.276598 21.957544'''
          new2 = '''M 379.176345 32.165322 \nL 433.176345 32.165322 \nL 433.176345 21.957544 \nL 379.176345 21.957544'''
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected Figure 1 label boxes not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)

          m = Path('manuscript/ROS_WORM_MANUSCRIPT_V3.md')
          t = m.read_text()
          t = t.replace('Figure1_framework_fixed.svg', 'Figure1_framework.svg')
          m.write_text(t)
          PY
      - name: Commit direct SVG edit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ros_worm_stage1/validation/publication_figures/main/Figure1_framework.svg manuscript/ROS_WORM_MANUSCRIPT_V3.md
          git commit -m 'Fix Figure 1 target label spacing'
          git push
