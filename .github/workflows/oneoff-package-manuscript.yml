name: One-off manuscript package

on:
  push:
    paths:
      - '.github/workflows/oneoff-package-manuscript.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained Markdown package
        run: |
          mkdir -p package/figures
          cp manuscript/ROS_WORM_MANUSCRIPT_V3.md package/ROS_WORM_MANUSCRIPT_V3_BOLDING.md
          cp ros_worm_stage1/validation/publication_figures/main/Figure1_framework.svg package/figures/
          cp ros_worm_stage1/validation/publication_figures/main/Figure2_neural_ROI.png package/figures/
          cp ros_worm_stage1/validation/publication_figures/main/Figure3_dose_and_surface.png package/figures/
          cp ros_worm_stage1/validation/publication_figures/main/Figure4_Cannon_exposures.png package/figures/
          cp ros_worm_stage1/validation/publication_figures/main/Figure5_radiolysis.png package/figures/
          cp ros_worm_stage1/validation/publication_figures/main/Figure6_target_chemistry.png package/figures/
          python - <<'PY'
          from pathlib import Path
          p = Path('package/ROS_WORM_MANUSCRIPT_V3_BOLDING.md')
          s = p.read_text()
          prefix = '../ros_worm_stage1/validation/publication_figures/main/'
          s = s.replace(prefix, 'figures/')
          p.write_text(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ROS_WORM_MANUSCRIPT_V3_BOLDING
          path: package/
          if-no-files-found: error
